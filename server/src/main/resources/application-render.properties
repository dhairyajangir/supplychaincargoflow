# Production profile for Render (activated with SPRING_PROFILES_ACTIVE=render).
# All secrets and hosts come from environment variables; see render.yaml.
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}
app.oauth.allowed-redirect-origins=${OAUTH_ALLOWED_REDIRECT_ORIGINS:${FRONTEND_URL}}

# Frontend (vercel.app) and API (onrender.com) are different sites
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render has no managed Kafka: listeners are off unless KAFKA_ENABLED=true,
# and the producer gives up fast so API calls never hang on a missing broker.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:false}
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.consumer.group-id=supply-chain-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.websocket.enabled=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.registration.google.client-name=Google

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
notification.email.from=${MAIL_FROM:no-reply@example.com}
notification.email.recipients=${MAIL_RECIPIENTS:}

management.endpoints.web.exposure.include=health

# Optional integrations (mail, Kafka) must not make /actuator/health report DOWN
management.health.mail.enabled=false
management.health.kafka.enabled=false
management.endpoint.health.show-details=never
